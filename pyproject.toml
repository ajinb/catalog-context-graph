[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catalog-context-graph"
version = "0.1.0"
description = "Turn a Backstage software catalog into an operational context graph that AI agents query over MCP: bounded blast-radius, ownership and change-risk tools instead of model-written queries, with Neo4j as an optional system of record."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Ajin Baby" }]
keywords = ["backstage", "knowledge-graph", "neo4j", "mcp", "ai-agents", "sre", "platform-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
neo4j = ["neo4j>=5.28"]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.16,<0.18", "mcp>=2.3,<3", "neo4j>=5.28"]

[project.scripts]
ccg = "catalog_context_graph.cli:entrypoint"

[project.urls]
Homepage = "https://cloudandsre.com"
Source = "https://github.com/ajinb/catalog-context-graph"
Issues = "https://github.com/ajinb/catalog-context-graph/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog_context_graph"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["neo4j: needs a running Neo4j (NEO4J_URI)"]

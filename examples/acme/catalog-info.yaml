  type: openapi
  lifecycle: production
  owner: team-checkout
  system: storefront
  definition: 'openapi: 3.1.0'
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: payments-api
spec:
  type: openapi
  lifecycle: production
  owner: team-payments
  system: payments
  definition: 'openapi: 3.1.0'
